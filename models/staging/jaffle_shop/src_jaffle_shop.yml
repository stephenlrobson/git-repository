version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a Postgres application db.
    loaded_at_field: _etl_loaded_at
    freshness:
      warn_after: {count: 1, period: hour}
      error_after: {count: 24, period: hour}
    tables:
     - name: customers
       description: Raw customer data.
       freshness: null
       columns:
       - name: id
         description: PK for customer data.
         tests:
            - unique
            - not_null
     - name: orders
       description: Raw orders data.
       columns:
         - name: id
           description: PK for orders data.
           tests:
            - unique
            - not_null

models:
  - name: stg_customer
    description: The grain of this table is one unique customer per row.
    columns:
      - name: customer_id
        description: Primary key for the customers table.
        data_tests:
          - unique
          - not_null
  - name: stg_orders
    description: One order per row.
    columns:
      - name: order_id
        description: PK for the orders table.
        data_tests:
          - unique
          - not_null
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              values:
                - shipped
                - returned
                - completed
                - return_pending
                - placed
      - name: customer_id
        data_tests:
          - relationships:
              field: customer_id
              to: ref('stg_customer')