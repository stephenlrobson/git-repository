version: 2

sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    loaded_at_field: _etl_loaded_at
    freshness:
      warn_after: {count: 1, period: hour}
      error_after: {count: 24, period: hour}
    tables:
     - name: customers
       freshness: null
       columns:
       - name: id
         tests:
            - unique
            - not_null
     - name: orders

models:
  - name: stg_customer
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              values:
                - shipped
                - returned
                - completed
                - return_pending
                - placed
      - name: customer_id
        data_tests:
          - relationships:
              field: customer_id
              to: ref('stg_customer')